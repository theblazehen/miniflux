[[feature]]
id = "entryreadingtime-filter-rule-compares"
title = "EntryReadingTime filter rule compares entry reading minutes with >, <, >=, <=, =, != (+1)"
behavior = "EntryReadingTime filter rule compares entry reading minutes with >, <, >=, <=, =, !=: A filter rule whose field name is `EntryReadingTime` is evaluated by filter.matchesRule (internal/reader/filter/filter.go) via isReadingTimeMatchingPattern(pattern string, readingTime int): the value's leading operator is detected by HasPrefix against the ordered list {\">=\", \"<=\", \"!=\", \">\", \"<\", \"=\"}, the remainder is TrimSpace'd and parsed with strconv.Atoi, and the comparison is done against entry.ReadingTime, which is a whole number of minutes. `>` and `<` are strict (a ReadingTime equal to the value does not match), `>=` and `<=` are inclusive, `=` means integer equality and `!=` means integer inequality. Rule syntax from the docs is `EntryReadingTime=>2`, `EntryReadingTime=<5`, `EntryReadingTime=>=10`, `EntryReadingTime=!=0` (field=operator+value, the parser splits on the first `=`).; EntryReadingTime rules with unsupported operator or non-integer value never match: isReadingTimeMatchingPattern returns false (no match, no error, no panic) when the value does not start with one of the six supported operators, or when the text after the operator is not a base-10 integer (strconv.Atoi error). S"
why = {text = "inferred from the fork's commits: feat: add EntryReadingTime filter, on-demand discussion links, GHCR build", source = "inferred"}
decision = "keep"
evidence = {commits = ["7ed763d6572de05f6cf8133fe576a156f5eebcff"], patch_ids = ["382a742d3d4f3a36980b69ead14d5ddf5fdcb777"], paths = ["AGENTS.md", "internal/reader/filter/filter.go", "internal/reader/filter/filter_test.go"]}
notes = "found by RepoSteward run repo-20261112T134703Z-0401 (its obligations L4, L5)"

[[feature]]
id = "get-v1-entries-entryid-discussions"
title = "Fetch cached Hacker News and Reddit discussions for an entry through the API"
behavior = "GET /v1/entries/{entryID}/discussions returns the discussions JSON envelope for the caller's entry: The API v1 handler registers \"GET /v1/entries/{entryID}/discussions\" (api.go, routes through the shared auth middleware) to getEntryDiscussionsHandler. The handler reads the entryID route param, answers JSON 400 \"invalid entry ID\" when it is 0, loads the entry through NewEntryQueryBuilder(request.UserID(r)).WithEntryID(id).WithoutStatus(model.EntryStatusRemoved) — so another user's entry, a removed entry or an unknown id yields JSON 404 — answers 200 with {\"discussions\":[]} without any provider lookup when entry.URL is empty, and otherwise returns Finder.Find(ctx, entry.URL) as DiscussionResponse{Discussions: []DiscussionLink}. The JSON envelope is {\"discussions\":[...]}, each element {source, title, url, comments, score, community (only for Reddit)}. Thanks to d5371c03 the slice is guaranteed non-nil so an empty result encodes as [] and never as null.; Discussion lookups are cached per normalized URL (TTL) and deduplicated by singleflight: Finder (internal/discussion/finder.go) keeps a shared in-memory TTL cache (internal/discussion/cache.go): get/set keyed by normalizeURL(entryURL),"
why = {text = "inferred from the fork's commits: feat: add EntryReadingTime filter, on-demand discussion links, GHCR build; fix: use normalized URL (strip fragment) when querying discussion providers", source = "inferred"}
decision = "keep"
evidence = {commits = ["7ed763d6572de05f6cf8133fe576a156f5eebcff", "d5371c03ba3ed82e999e4cfc5071123908384b95"], patch_ids = ["382a742d3d4f3a36980b69ead14d5ddf5fdcb777", "653b8c48e5dc85b13435f620565726cb5b72e692"], paths = ["internal/api/api.go", "internal/api/discussion_handlers.go", "internal/discussion/cache.go", "internal/discussion/discussion.go", "internal/discussion/finder.go", "internal/discussion/hackernews.go", "internal/discussion/reddit.go"]}
notes = "found by RepoSteward run repo-20261112T134703Z-0401 (its obligations L8, L11, L12, L13)"

[[feature]]
