[[feature]]
id = "validator-accepts-entryreadingtime"
title = "Validator accepts EntryReadingTime filter rules without regex-checking their values"
behavior = "Validator accepts EntryReadingTime filter rules without regex-checking their values: validator.isValidFilterRules gained \"EntryReadingTime\" in its hardcoded fieldNames list (internal/validator/filter.go:15) and an early `continue` for fieldName == \"EntryReadingTime\" placed after the non-empty-value check (filter.go:37-40), so an EntryReadingTime rule such as `EntryReadingTime=>2`, `EntryReadingTime=<5`, `EntryReadingTime=>=10` or `EntryReadingTime=!=0` is accepted instead of failing the RE2 regex check that applies to all other fields. The structural checks still apply: an unknown field name yields error.settings_<block|keep>_rule_fieldname_invalid (whose argument lists the allowed field names, now including 'EntryReadingTime'), a missing `=` yields error.settings_<type>_rule_separator_required, and an empty value yields error.settings_<type>_rule_regex_required. This is reachable through validator.ValidateUserModificationRequest, which calls isValidFilterRules(*changes.BlockFilterEntryRules, \"block\") and (*changes.KeepFilterEntryRules, \"keep\") when those fields are non-empty."
why = {text = "inferred from the fork's commits: fix: add EntryReadingTime to validator allowlist", source = "inferred"}
decision = "keep"
evidence = {commits = ["9491bcd84b9fb8caa610c85e62d94d09013673c1"], patch_ids = ["4b4a1054071bae033f2225899061f558616684ad"], paths = ["internal/validator/filter.go", "internal/validator/filter_test.go", "internal/validator/user.go"]}
notes = "found by RepoSteward run repo-20261112T134703Z-0401 (its obligations L7)"

[[feature]]
id = "entryreadingtime-rules-are-evaluated"
title = "EntryReadingTime rules are evaluated after reading time is computed, in one unconditional post-processing filter pass"
behavior = "EntryReadingTime rules are evaluated after reading time is computed, in one unconditional post-processing filter pass: In internal/reader/processor/processor.go, ProcessFeedEntries now calls updateEntryReadingTime(store, feed, entry, entryIsNew, user) (processor.go:153) *before* the post-processing filter check `if filter.IsBlockedEntry(blockRules, allowRules, feed, entry)` (processor.go:156), so EntryReadingTime rules see the real entry.ReadingTime instead of 0. The earlier conditional pass (`if contentExtractedSuccessfully && filter.IsBlockedEntry(...)`, filter_stage \"after_scrape\") was removed, so the post-processing pass is unconditional and runs after scraping, content rewrite rules, sanitizing and reading-time calculation, with filter_stage \"after_processing\"; the pre-scrape pass (filter_stage \"before_scrape\") is unchanged. updateEntryReadingTime returns immediately when user.ShowReadingTime is false (ReadingTime stays 0), otherwise it may set ReadingTime from a platform watch time (YouTube/Nebula/Odysee/Bilibili, or store.GetReadTime for existing entries) and finally falls back to readingtime.EstimateReadingTime(entry.Content, ...) when ReadingTime is 0 and content is non-em"
why = {text = "inferred from the fork's commits: fix: run EntryReadingTime filter after reading time is calculated; refactor: move reading time before filter instead of adding third pass", source = "inferred"}
decision = "keep"
evidence = {commits = ["21cd873f484aa720ce6b8e28a9ad222404b5e177", "982e5425843ce82fd316ae28790e5061e5e3ec4f"], patch_ids = ["9930d34df936604ac7313565ef8e8e6dc6ba8d2d", "a94393812d95ce1629cca940228e0bcf4eaf079f"], paths = ["internal/reader/filter/filter.go", "internal/reader/processor/processor.go", "internal/reader/processor/reading_time.go"]}
notes = "found by RepoSteward run repo-20261112T134703Z-0401 (its obligations L9)"

