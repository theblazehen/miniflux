[[feature]]
id = "hn-submission-links-percent-encode"
title = "HN submission links percent-encode spaces as %20"
behavior = "HN submission links percent-encode spaces as %20: The template func map gains `queryStringPercentEncoded`, which builds the same query string as `queryString` (leading \"?\", url.Values.Encode, empty/zero values dropped) and then replaces every \"+\" with \"%20\". Both Hacker News \"submitlink\" anchors — the list-view action bar in internal/template/templates/common/item_meta.html and the entry-detail action bar in internal/template/templates/views/entry.html — call it with `(dict \"u\" .entry.URL \"t\" .entry.Title)`. So for an entry with URL \"https://example.org/an article\" and title \"An article title\" the rendered href is `https://news.ycombinator.com/submitlink?t=An%20article%20title&amp;u=https%3A%2F%2Fexample.org%2Fan%20article` (keys sorted by url.Values.Encode, the \"&\" separator HTML-escaped by html/template) and contains no \"+\". `queryString` itself is unchanged and still used by pagination, search and prev/next links, which keep encoding spaces as \"+\"."
why = {text = "inferred from the fork's commits: fix: percent-encode spaces in HN submissions", source = "inferred"}
decision = "keep"
evidence = {commits = ["d84c1a93d39aa80b081c1ac9c92b44d34de1ee35"], patch_ids = ["524dd93ebdd49f44f1624a6c4a290a0d2bc1cb61"], paths = ["internal/template/functions.go", "internal/template/functions_test.go", "internal/template/templates/common/item_meta.html", "internal/template/templates/views/entry.html"]}
notes = "found by RepoSteward run repo-20261112T134703Z-0401 (its obligations L1)"

[[feature]]
id = "discussion-links-render-in-the-entry"
